[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysvar-local-agent"
version = "0.1.0"
description = "Sysvar Local Agent para detecção segura de XML de NF-e"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3",
    "pywin32>=306; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
include = ["sysvar_agent*"]
